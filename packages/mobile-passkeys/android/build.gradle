plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'xyz.grape.wallet'
version = '0.1.0'

android {
  namespace "expo.modules.grapemobilepasskeys"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
    minSdkVersion 24
  }
}

dependencies {
  api "androidx.credentials:credentials:1.3.0"
  api "androidx.credentials:credentials-play-services-auth:1.3.0"
}
